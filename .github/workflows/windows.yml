name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - '*.go'
      - 'cmd/**'
      - 'internal/**'
      - 'build.ps1'
      - 'build.bat'
      - 'go.mod'
      - 'ui/**'
      - 'scripts/**'
      - '.github/workflows/windows.yml'
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: pwsh -File ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Portline-windows-x64
          path: Portline.exe

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test Bash installer parser and Go packages
        run: |
          go test ./...
          bash -n scripts/*.sh

name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - '*.go'
      - 'go.mod'
      - 'ui/**'
      - 'scripts/**'
      - '.github/workflows/windows.yml'
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...
      - run: go build -trimpath -ldflags="-H windowsgui -s -w" -o Portline.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: Portline-windows-x64
          path: Portline.exe
